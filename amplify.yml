version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run lint
        - npm test
        - VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://uwv0zhujxf.execute-api.ap-northeast-2.amazonaws.com}" npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
